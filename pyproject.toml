[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chengdu-local-rag"
version = "0.1.0"
description = "Local document retrieval for agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3,<5",
    "numpy>=1.26,<3",
    "sentence-transformers>=5.1,<6",
    "transformers>=4.41,<5",
]

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
rag = "local_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["model: end-to-end test with the real E5 model"]
